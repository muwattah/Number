<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Send me a WhatsApp message." />
  <title>+212 716-615621</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f0c;
      --card: #111713;
      --text: #f4f7f5;
      --muted: #aeb8b1;
      --whatsapp: #25d366;
      --whatsapp-hover: #20bd5a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(37, 211, 102, 0.14), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(94vw, 900px);
      padding: 56px 24px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .number {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 7rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 900;
      text-wrap: balance;
    }

    .actions {
      margin-top: 38px;
      display: flex;
      justify-content: center;
    }

    .whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 58px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--whatsapp);
      color: #07110a;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 34px rgba(37, 211, 102, 0.22);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .whatsapp:hover {
      background: var(--whatsapp-hover);
      transform: translateY(-2px);
      box-shadow: 0 16px 42px rgba(37, 211, 102, 0.28);
    }

    .whatsapp:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .whatsapp svg {
      width: 27px;
      height: 27px;
      fill: currentColor;
      flex: 0 0 auto;
    }

    @media (max-width: 520px) {
      main { padding-inline: 18px; }
      .number { letter-spacing: -0.04em; }
      .whatsapp { width: 100%; max-width: 360px; }
    }
  </style>
</head>
